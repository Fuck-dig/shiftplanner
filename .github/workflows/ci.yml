name: CI

on:
  # Every branch, not just main. The whole point of the branch -> preview ->
  # merge flow is that work is checked BEFORE it reaches main, so CI has to
  # run there too — gating only main means the gate opens after the horse has
  # bolted.
  push:
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless. Cancel it
# rather than queueing, so the answer you're waiting on is about the code you
# actually have.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Narrow lint gate — see eslint.ci.config.js for why this isn't the
      # full `npm run lint` (that has a ~140-item cosmetic backlog). This
      # catches rules-of-hooks violations, which white-screen the app for
      # every user; one shipped to production on 2026-08-03.
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
